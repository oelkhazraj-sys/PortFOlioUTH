<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">AI-Enhanced ERP Knowledge Assistant</title>
  <desc id="desc">System diagram showing data sources, ingestion, vector search, policy controls, and ERP assistant responses with citations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a36" />
      <stop offset="55%" stop-color="#10284b" />
      <stop offset="100%" stop-color="#163e66" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b3963" />
      <stop offset="100%" stop-color="#234a77" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#081224" flood-opacity="0.45" />
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64ffda" />
    </marker>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)" />
  <g opacity="0.2">
    <circle cx="1260" cy="120" r="210" fill="#64ffda" />
    <circle cx="140" cy="760" r="220" fill="#89a8ff" />
  </g>

  <text x="700" y="84" text-anchor="middle" fill="#e6f1ff" font-size="44" font-family="Segoe UI, Arial, sans-serif" font-weight="700">
    AI-Enhanced ERP Knowledge Assistant
  </text>
  <text x="700" y="124" text-anchor="middle" fill="#a7bddc" font-size="24" font-family="Segoe UI, Arial, sans-serif">
    Retrieval system with governance, traceability, and ERP integration
  </text>

  <g filter="url(#shadow)">
    <rect x="76" y="186" width="380" height="152" rx="20" fill="url(#panel)" />
    <rect x="510" y="186" width="380" height="152" rx="20" fill="url(#panel)" />
    <rect x="944" y="186" width="380" height="152" rx="20" fill="url(#panel)" />

    <rect x="76" y="444" width="380" height="152" rx="20" fill="url(#panel)" />
    <rect x="510" y="444" width="380" height="152" rx="20" fill="url(#panel)" />
    <rect x="944" y="444" width="380" height="152" rx="20" fill="url(#panel)" />
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="108" y="230" fill="#64ffda" font-size="21" font-weight="700">01  Sources</text>
    <text x="108" y="262" fill="#d7e7ff" font-size="18">ERP manuals, SOPs, support tickets</text>
    <text x="108" y="290" fill="#d7e7ff" font-size="18">Knowledge base + policy documents</text>

    <text x="542" y="230" fill="#64ffda" font-size="21" font-weight="700">02  Ingestion Pipeline</text>
    <text x="542" y="262" fill="#d7e7ff" font-size="18">Parse, clean, chunk, and metadata tags</text>
    <text x="542" y="290" fill="#d7e7ff" font-size="18">Nightly sync and delta updates</text>

    <text x="976" y="230" fill="#64ffda" font-size="21" font-weight="700">03  Embeddings + Index</text>
    <text x="976" y="262" fill="#d7e7ff" font-size="18">Semantic vectors stored by tenant</text>
    <text x="976" y="290" fill="#d7e7ff" font-size="18">Fast nearest-neighbor retrieval</text>

    <text x="108" y="488" fill="#64ffda" font-size="21" font-weight="700">04  Access Boundaries</text>
    <text x="108" y="520" fill="#d7e7ff" font-size="18">Role-based filters before retrieval</text>
    <text x="108" y="548" fill="#d7e7ff" font-size="18">Audit logs for each question</text>

    <text x="542" y="488" fill="#64ffda" font-size="21" font-weight="700">05  Retrieval + Rerank</text>
    <text x="542" y="520" fill="#d7e7ff" font-size="18">Top-k context + confidence checks</text>
    <text x="542" y="548" fill="#d7e7ff" font-size="18">Answer always includes citations</text>

    <text x="976" y="488" fill="#64ffda" font-size="21" font-weight="700">06  ERP Assistant UI</text>
    <text x="976" y="520" fill="#d7e7ff" font-size="18">Embedded in Odoo / Sage workflows</text>
    <text x="976" y="548" fill="#d7e7ff" font-size="18">FastAPI endpoint + feedback loop</text>
  </g>

  <g stroke="#64ffda" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <line x1="456" y1="260" x2="510" y2="260" />
    <line x1="890" y1="260" x2="944" y2="260" />
    <path d="M1134 338 L1134 402 L266 402 L266 444" />
    <line x1="456" y1="518" x2="510" y2="518" />
    <line x1="890" y1="518" x2="944" y2="518" />
  </g>

  <g font-family="Consolas, monospace">
    <rect x="350" y="670" width="700" height="130" rx="16" fill="#0d2240" stroke="#2e5789" />
    <text x="392" y="718" fill="#d8e7ff" font-size="26">Outputs:</text>
    <text x="520" y="718" fill="#64ffda" font-size="26">Traceable answers with source links</text>
    <text x="392" y="758" fill="#d8e7ff" font-size="26">Ops:</text>
    <text x="468" y="758" fill="#64ffda" font-size="26">Sub-3s response target + audit-ready logs</text>
  </g>
</svg>
