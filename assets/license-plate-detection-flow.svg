<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Vehicle License Plate Detection Pipeline</title>
  <desc id="desc">End-to-end flow from data labeling to model training and deployment for automatic license plate detection.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1d3a" />
      <stop offset="55%" stop-color="#123055" />
      <stop offset="100%" stop-color="#1a3f69" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c3d66" />
      <stop offset="100%" stop-color="#25507b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#081224" flood-opacity="0.45" />
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64ffda" />
    </marker>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)" />
  <g opacity="0.2">
    <circle cx="1250" cy="130" r="210" fill="#64ffda" />
    <circle cx="150" cy="760" r="230" fill="#8cb0ff" />
  </g>

  <text x="700" y="84" text-anchor="middle" fill="#e6f1ff" font-size="42" font-family="Segoe UI, Arial, sans-serif" font-weight="700">
    License Plate Detection Pipeline
  </text>
  <text x="700" y="124" text-anchor="middle" fill="#a9bddb" font-size="23" font-family="Segoe UI, Arial, sans-serif">
    From dataset labeling to production deployment
  </text>

  <g filter="url(#shadow)">
    <rect x="72" y="186" width="370" height="150" rx="20" fill="url(#card)" />
    <rect x="514" y="186" width="370" height="150" rx="20" fill="url(#card)" />
    <rect x="956" y="186" width="370" height="150" rx="20" fill="url(#card)" />

    <rect x="72" y="452" width="370" height="150" rx="20" fill="url(#card)" />
    <rect x="514" y="452" width="370" height="150" rx="20" fill="url(#card)" />
    <rect x="956" y="452" width="370" height="150" rx="20" fill="url(#card)" />
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="104" y="230" fill="#64ffda" font-size="21" font-weight="700">01  Data Collection</text>
    <text x="104" y="262" fill="#d8e6ff" font-size="18">Traffic and parking camera frames</text>
    <text x="104" y="290" fill="#d8e6ff" font-size="18">Diverse weather and lighting conditions</text>

    <text x="546" y="230" fill="#64ffda" font-size="21" font-weight="700">02  Labeling &amp; QA</text>
    <text x="546" y="262" fill="#d8e6ff" font-size="18">Annotate plate bounding boxes</text>
    <text x="546" y="290" fill="#d8e6ff" font-size="18">Review consistency and class quality</text>

    <text x="988" y="230" fill="#64ffda" font-size="21" font-weight="700">03  Model Training</text>
    <text x="988" y="262" fill="#d8e6ff" font-size="18">YOLOv8 training with augmentation</text>
    <text x="988" y="290" fill="#d8e6ff" font-size="18">Hyperparameter tuning and checkpoints</text>

    <text x="104" y="496" fill="#64ffda" font-size="21" font-weight="700">04  Evaluation</text>
    <text x="104" y="528" fill="#d8e6ff" font-size="18">mAP, precision, recall, latency tests</text>
    <text x="104" y="556" fill="#d8e6ff" font-size="18">Hard-case validation for night scenes</text>

    <text x="546" y="496" fill="#64ffda" font-size="21" font-weight="700">05  OCR + API</text>
    <text x="546" y="528" fill="#d8e6ff" font-size="18">Plate cropping + OCR text extraction</text>
    <text x="546" y="556" fill="#d8e6ff" font-size="18">FastAPI endpoint for real-time inference</text>

    <text x="988" y="496" fill="#64ffda" font-size="21" font-weight="700">06  Deployment</text>
    <text x="988" y="528" fill="#d8e6ff" font-size="18">Dockerized service on cloud edge nodes</text>
    <text x="988" y="556" fill="#d8e6ff" font-size="18">Monitoring, drift alerts, model updates</text>
  </g>

  <g stroke="#64ffda" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <line x1="442" y1="260" x2="514" y2="260" />
    <line x1="884" y1="260" x2="956" y2="260" />
    <path d="M1142 336 L1142 404 L258 404 L258 452" />
    <line x1="442" y1="526" x2="514" y2="526" />
    <line x1="884" y1="526" x2="956" y2="526" />
  </g>

  <g font-family="Consolas, monospace">
    <rect x="340" y="672" width="720" height="130" rx="16" fill="#0d2240" stroke="#2e5789" />
    <text x="382" y="720" fill="#d8e7ff" font-size="26">Model:</text>
    <text x="490" y="720" fill="#64ffda" font-size="26">YOLOv8 + OCR for plate recognition</text>
    <text x="382" y="760" fill="#d8e7ff" font-size="26">Target:</text>
    <text x="504" y="760" fill="#64ffda" font-size="26">Real-time detection in production traffic streams</text>
  </g>
</svg>
